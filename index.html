<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Where Are My Micro">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#E9F0F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1720" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icono-192.png">
<link rel="manifest" href="manifest.json">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}[hidden]{display:none!important}</style>
<title>Where are my Micro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@500;700;900&family=Overpass+Mono:wght@600;700&display=swap">
<style>
/* Layout: una calle — cielo arriba, letreros de paradero plantados en una vereda, en grilla de 2 columnas que pasa a 3–4 en pantallas anchas */
:root{
  --sky:#E9F0F3; --sky2:#D5E3EA; --ink:#13202B; --muted:#55687A;
  --plate:#FFFFFF; --plate-ink:#13202B; --band:#E2382F; --band-ink:#FFFFFF;
  --route:#F5B700; --route-ink:#1C1500; --pole:#8A98A5; --curb:#C4CDD4; --toast:#13202B; --toast-ink:#FFFFFF;
  --r418:#2E9E44; --r425:#E0569B; --r429:#8A4FD8; --r210:#2F6FDB; --r210v:#5BC4F0; --chip-ink:#FFFFFF; --chip-ink-dark:#0B2A3A;
  --f-display:"Overpass",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-code:"Overpass Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --sky:#0E1720; --sky2:#16232F; --ink:#E7EEF3; --muted:#93A6B6;
  --plate:#1C2A36; --plate-ink:#F1F5F8; --band:#E24A41; --band-ink:#FFFFFF;
  --route:#F5B700; --route-ink:#1C1500; --pole:#4C5D6B; --curb:#24333F; --toast:#F1F5F8; --toast-ink:#13202B; color-scheme:dark}}
:root[data-theme="dark"]{
  --sky:#0E1720; --sky2:#16232F; --ink:#E7EEF3; --muted:#93A6B6;
  --plate:#1C2A36; --plate-ink:#F1F5F8; --band:#E24A41; --band-ink:#FFFFFF;
  --route:#F5B700; --route-ink:#1C1500; --pole:#4C5D6B; --curb:#24333F; --toast:#F1F5F8; --toast-ink:#13202B; color-scheme:dark}

html,body{min-height:100%}
body{background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 100%);color:var(--ink);font-family:var(--f-display);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

header{display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;gap:12px}
.busmark{width:46px;height:34px;flex:none;position:relative}
h1{margin:0;font-weight:900;font-size:clamp(28px,8vw,44px);line-height:.95;letter-spacing:-.02em;text-wrap:balance}
h1 span{color:var(--band)}
.sub{margin:0;color:var(--muted);font-size:15px;max-width:52ch}

.routes{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.routes .lbl{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.chip{font-family:var(--f-code);font-weight:700;font-size:14px;padding:5px 10px 3px;border-radius:6px;background:var(--plate);color:var(--plate-ink);border:1.5px solid var(--curb);font-variant-numeric:tabular-nums}
.chip.main{background:var(--route);color:var(--route-ink);border-color:var(--route);font-size:17px;padding:6px 14px 4px;box-shadow:0 2px 0 rgba(0,0,0,.15)}

.street{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 16px;padding-top:6px}
@media (min-width:620px){.street{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:820px){.street{grid-template-columns:repeat(4,minmax(0,1fr))}}

.stop{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:inherit;-webkit-tap-highlight-color:transparent;
  animation:plant .6s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(var(--i)*70ms);outline:none}
.plate{width:100%;background:var(--plate);color:var(--plate-ink);border-radius:12px;overflow:hidden;position:relative;
  box-shadow:0 1px 0 rgba(0,0,0,.06),0 8px 18px -10px rgba(10,25,40,.45);transform-origin:50% 100%;transition:transform .25s ease}
.band{background:var(--band);color:var(--band-ink);display:flex;justify-content:space-between;align-items:center;padding:6px 10px 4px;
  font-size:10px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}
.band svg{width:16px;height:12px}
.code{font-family:var(--f-code);font-weight:700;font-size:clamp(26px,8vw,34px);letter-spacing:.02em;line-height:1;padding:14px 10px 6px;text-align:center;font-variant-numeric:tabular-nums}
.name{text-align:center;font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:0 8px 10px;min-height:2.4em;display:flex;align-items:center;justify-content:center;text-wrap:balance}
.rts{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:0 8px 12px}
.rts .chip{font-size:13px;padding:4px 8px 2px}
.rts .chip.main{font-size:14px;padding:4px 10px 2px}
.rts .chip[class*="r-"]{color:var(--chip-ink);border-color:transparent;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.chip.r-418{background:var(--r418)}.chip.r-425{background:var(--r425)}.chip.r-429{background:var(--r429)}
.chip.r-210{background:var(--r210)}.chip.r-210V{background:var(--r210v)}
.rts .chip.r-210V{color:var(--chip-ink-dark)}
.lane{height:16px;border-top:1.5px dashed var(--curb);position:relative;overflow:hidden}
.mini{position:absolute;left:-40px;top:3px;width:30px;height:10px;border-radius:3px 4px 2px 2px;background:var(--route)}
.mini::before,.mini::after{content:"";position:absolute;bottom:-3px;width:5px;height:5px;border-radius:50%;background:var(--plate-ink)}
.mini::before{left:4px}.mini::after{right:4px}
.pole{width:6px;height:26px;background:var(--pole);border-radius:0 0 2px 2px}
.base{width:46px;height:6px;border-radius:6px;background:var(--curb)}

.stop:hover .plate{transform:rotate(-1.5deg) translateY(-2px)}
.stop:focus-visible .plate{box-shadow:0 0 0 3px var(--route),0 8px 18px -10px rgba(10,25,40,.45)}
.stop:active .plate{transform:scale(.97)}
.stop.go .plate{animation:wiggle .5s ease}
.stop.go .mini{animation:drive .9s ease-in forwards}

@keyframes plant{from{transform:translateY(14px) scaleY(.94)}to{transform:none}}
@keyframes wiggle{0%{transform:rotate(0)}30%{transform:rotate(-3deg)}60%{transform:rotate(2deg)}100%{transform:rotate(0)}}
@keyframes drive{from{left:-40px}to{left:110%}}

.how{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:13.5px;line-height:1.5;max-width:60ch}
.how b{color:var(--ink)}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140%);background:var(--toast);color:var(--toast-ink);
  padding:12px 16px;border-radius:12px;font-weight:700;font-size:14px;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);transition:transform .35s cubic-bezier(.2,1.3,.4,1);max-width:calc(100% - 32px);text-align:center}
.toast.show{transform:translate(-50%,0)}
.toast code{font-family:var(--f-code);background:var(--route);color:var(--route-ink);padding:1px 6px;border-radius:4px}

/* bus del logo */
.busmark .body{position:absolute;inset:0 0 7px 0;background:var(--band);border-radius:7px 9px 4px 4px;animation:idle 1.6s ease-in-out infinite}
.busmark .win{position:absolute;top:5px;height:10px;background:var(--sky);border-radius:2px}
.busmark .w1{left:5px;width:11px}.busmark .w2{left:19px;width:11px}.busmark .w3{left:33px;width:8px}
.busmark .tire{position:absolute;bottom:0;width:12px;height:12px;border-radius:50%;background:var(--ink);border:3px solid var(--sky2)}
.busmark .t1{left:5px}.busmark .t2{right:5px}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <div class="brand">
      <div class="busmark" aria-hidden="true"><div class="body"><div class="win w1"></div><div class="win w2"></div><div class="win w3"></div></div><div class="tire t1"></div><div class="tire t2"></div></div>
      <h1>Where are my <span>Micro</span></h1>
    </div>
    <p class="sub">Toca un paradero para ver en cuánto llega tu micro.</p>
  </header>

  <main class="street" id="street"></main>

</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const RED_URL = "https://www.red.cl/planifica-tu-viaje/cuando-llega/?codsimt=";
const STOPS = [
  ["PD390","Casa",["D05","418","429"]],["PD369","Gym",["418","429","425"]],
  ["PH204","U",["210","210V"]],["PA502","Metro Ñuble",["D05"]],
  ["PD851","Metro Grecia",["D05"]],["PD856","Casa Cati",["D05"]],["PD891","Casa Cati – Gym",["425"]]
];
const street = document.getElementById("street");
const toast = document.getElementById("toast");
let tt;

STOPS.forEach(([code,name,routes],i)=>{
  const a = document.createElement("a");
  a.className = "stop"; a.href = RED_URL + code; a.target = "_blank"; a.rel = "noopener";
  a.style.setProperty("--i", i);
  a.setAttribute("aria-label", `Paradero ${code}, ${name}. Micros ${routes.join(", ")}. Ver en cuánto llega en RED`);
  a.innerHTML = `<div class="plate">
      <div class="band"><span>Paradero</span><svg viewBox="0 0 16 12" aria-hidden="true"><rect x="0.5" y="0.5" width="15" height="8.5" rx="2" fill="currentColor"/><rect x="2.5" y="2" width="4" height="3" rx=".6" fill="var(--band)"/><rect x="8" y="2" width="5.5" height="3" rx=".6" fill="var(--band)"/><circle cx="4" cy="10" r="1.6" fill="currentColor"/><circle cx="12" cy="10" r="1.6" fill="currentColor"/></svg></div>
      <div class="code"></div>
      <div class="name"></div>
      <div class="rts"></div>
      <div class="lane"><div class="mini"></div></div>
    </div><div class="pole"></div><div class="base"></div>`;
  a.querySelector(".code").textContent = code;
  a.querySelector(".name").textContent = name;
  const rts = a.querySelector(".rts");
  routes.forEach(r=>{ const s=document.createElement("span"); s.className="chip "+(r==="D05"?"main":"r-"+r); s.textContent=r; rts.appendChild(s); });
  a.addEventListener("click", ()=>{
    show(`Abriendo <code>${code}</code> en RED…`);
    a.classList.remove("go"); void a.offsetWidth; a.classList.add("go");
  });
  street.appendChild(a);
});

function show(html){
  toast.innerHTML = html; toast.classList.add("show");
  clearTimeout(tt); tt = setTimeout(()=>toast.classList.remove("show"), 2600);
}
</script>

</body>
</html>
